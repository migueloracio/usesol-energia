<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- Sun Icon -->
  <g transform="translate(40, 40)">
    <rect x="-30" y="-30" width="60" height="60" rx="16" fill="#F7A838" fill-opacity="0.15" stroke="#F7A838" stroke-width="1.5"/>
    <g fill="#F7A838">
      <polygon points="-5,-22 5,-22 7,-15 -7,-15" transform="rotate(0)"/>
      <polygon points="-5,-22 5,-22 7,-15 -7,-15" transform="rotate(45)"/>
      <polygon points="-5,-22 5,-22 7,-15 -7,-15" transform="rotate(90)"/>
      <polygon points="-5,-22 5,-22 7,-15 -7,-15" transform="rotate(135)"/>
      <polygon points="-5,-22 5,-22 7,-15 -7,-15" transform="rotate(180)"/>
      <polygon points="-5,-22 5,-22 7,-15 -7,-15" transform="rotate(225)"/>
      <polygon points="-5,-22 5,-22 7,-15 -7,-15" transform="rotate(270)"/>
      <polygon points="-5,-22 5,-22 7,-15 -7,-15" transform="rotate(315)"/>
    </g>
    <circle r="9" fill="#005A36" />
    <circle r="5" fill="#FFFFFF" />
  </g>

  <!-- Wordmark -->
  <text x="85" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="34" letter-spacing="-1">
    <tspan fill="#005A36">use</tspan><tspan fill="#F7A838">sol</tspan>
  </text>
  <text x="86" y="60" font-family="'Outfit', system-ui, sans-serif" font-weight="700" font-size="11" fill="#005A36" letter-spacing="2.5">
    ENERGIA RENOVÁVEL
  </text>
</svg>
